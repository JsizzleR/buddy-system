<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 72" width="420" height="72" role="img" aria-labelledby="t">
<title id="t">buddy system</title>
<!-- Text only, two colours, no external fonts. The colours are mid-tone so the
     mark reads on GitHub's white (#ffffff) and dark (#0d1117) page backgrounds
