     theme it is in. -->
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; }
</style>
<text x="6" y="52" font-size="48" font-weight="700" fill="#2ea043" letter-spacing="-1">buddy</text>
<text x="176" y="52" font-size="48" font-weight="300" fill="#4493f8">system</text>
<text x="6" y="68" font-size="11" fill="#4493f8" letter-spacing="0.5">a claims ledger for fleets of coding agents</text>
</svg>
