<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 544" width="960" height="544" role="img" aria-labelledby="t d">
<title id="t">Two Claude Code sessions share a repo: each claims a scope and edits inside it; when one reaches into the other's scope the buddy gate denies the edit and names the holder, a message and a release later its own claim is granted</title>
<desc id="d">Every output line is buddy's own, captured 2026-10-25 in a scratch repository (git init, buddy init, two session ids; no session ran: the hooks were fed the JSON Claude Code sends, and the ⏺ Edit(…) lines are those tool calls written as Claude Code renders them). Long lines are soft-wrapped at 58 columns and trimmed with an ellipsis; the output is preserved except for that wrapping and trimming. Prompts, the ⏺ Edit(…) lines and the lines starting with # are typeset, not captured. Loops every 25 s; under prefers-reduced-motion the final frame is shown still.</desc>
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; font-size: 12px; white-space: pre; }
.still { display: none; }
@media (prefers-reduced-motion: reduce) { .live { display: none; } .still { display: inline; } }
</style>
<rect width="960" height="544" rx="10" fill="#0d1117"/>
<rect x="12" y="12" width="462" height="520" rx="8" fill="#161b22" stroke="#30363d"/>
<line x1="12" y1="40" x2="474" y2="40" stroke="#30363d"/>
<circle cx="30" cy="26" r="5" fill="#ff5f56"/>
<circle cx="48" cy="26" r="5" fill="#ffbd2e"/>
<circle cx="66" cy="26" r="5" fill="#27c93f"/>
<text x="243" y="30" text-anchor="middle" fill="#8b949e" font-size="11">lane-a</text>
<rect x="486" y="12" width="462" height="520" rx="8" fill="#161b22" stroke="#30363d"/>
