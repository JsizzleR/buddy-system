<defs>
<clipPath id="c1"><rect x="24" y="50" width="0" height="18"><animate attributeName="width" from="0" to="415" dur="0.62s" begin="cycle.begin+0.50s" fill="freeze"/></rect></clipPath>
<clipPath id="c2"><rect x="24" y="68" width="0" height="18"><animate attributeName="width" from="0" to="174" dur="0.25s" begin="cycle.begin+1.12s" fill="freeze"/></rect></clipPath>
<clipPath id="c3"><rect x="498" y="50" width="0" height="18"><animate attributeName="width" from="0" to="393" dur="0.58s" begin="cycle.begin+3.40s" fill="freeze"/></rect></clipPath>
<clipPath id="c4"><rect x="498" y="68" width="0" height="18"><animate attributeName="width" from="0" to="159" dur="0.23s" begin="cycle.begin+3.98s" fill="freeze"/></rect></clipPath>
<clipPath id="c5"><rect x="24" y="176" width="0" height="18"><animate attributeName="width" from="0" to="79" dur="0.11s" begin="cycle.begin+6.20s" fill="freeze"/></rect></clipPath>
<clipPath id="c6"><rect x="498" y="284" width="0" height="18"><animate attributeName="width" from="0" to="422" dur="0.63s" begin="cycle.begin+10.20s" fill="freeze"/></rect></clipPath>
<clipPath id="c7"><rect x="498" y="302" width="0" height="18"><animate attributeName="width" from="0" to="167" dur="0.24s" begin="cycle.begin+10.83s" fill="freeze"/></rect></clipPath>
<clipPath id="c8"><rect x="24" y="374" width="0" height="18"><animate attributeName="width" from="0" to="159" dur="0.23s" begin="cycle.begin+13.20s" fill="freeze"/></rect></clipPath>
<clipPath id="c9"><rect x="498" y="392" width="0" height="18"><animate attributeName="width" from="0" to="429" dur="0.64s" begin="cycle.begin+14.60s" fill="freeze"/></rect></clipPath>
<clipPath id="c10"><rect x="498" y="410" width="0" height="18"><animate attributeName="width" from="0" to="181" dur="0.26s" begin="cycle.begin+15.24s" fill="freeze"/></rect></clipPath>
</defs>
<g clip-path="url(#c1)"><text x="26" y="64" fill="#e6edf3" opacity="0"><tspan fill="#3fb950">$</tspan> buddy claim store --desc "reworking the ledger schema"<set attributeName="opacity" to="1" begin="cycle.begin+0.50s" end="cycle.end"/></text></g>
<g clip-path="url(#c2)"><text x="26" y="82" fill="#e6edf3" opacity="0">--scope internal/store/<set attributeName="opacity" to="1" begin="cycle.begin+1.12s" end="cycle.end"/></text></g>
<text x="26" y="100" fill="#3fb950" opacity="0">claimed "store" for lane-a — scopes: internal/store/<set attributeName="opacity" to="1" begin="cycle.begin+1.70s" end="cycle.end"/></text>
<text x="26" y="136" fill="#e6edf3" opacity="0">⏺ Edit(internal/store/ledger.go)<set attributeName="opacity" to="1" begin="cycle.begin+2.40s" end="cycle.end"/></text>
<text x="26" y="154" fill="#8b949e" font-style="italic" opacity="0"># PreToolUse hook → buddy gate: allowed (a silent hook)<set attributeName="opacity" to="1" begin="cycle.begin+2.80s" end="cycle.end"/></text>
<g clip-path="url(#c3)"><text x="500" y="64" fill="#e6edf3" opacity="0"><tspan fill="#3fb950">$</tspan> buddy claim api --desc "rate limits on the handler"<set attributeName="opacity" to="1" begin="cycle.begin+3.40s" end="cycle.end"/></text></g>
<g clip-path="url(#c4)"><text x="500" y="82" fill="#e6edf3" opacity="0">--scope internal/api/<set attributeName="opacity" to="1" begin="cycle.begin+3.98s" end="cycle.end"/></text></g>
<text x="500" y="100" fill="#3fb950" opacity="0">claimed "api" for lane-b — scopes: internal/api/<set attributeName="opacity" to="1" begin="cycle.begin+4.50s" end="cycle.end"/></text>
<text x="500" y="136" fill="#e6edf3" opacity="0">⏺ Edit(internal/api/handler.go)<set attributeName="opacity" to="1" begin="cycle.begin+5.00s" end="cycle.end"/></text>
<text x="500" y="154" fill="#8b949e" font-style="italic" opacity="0"># PreToolUse hook → buddy gate: allowed (a silent hook)<set attributeName="opacity" to="1" begin="cycle.begin+5.40s" end="cycle.end"/></text>
<g clip-path="url(#c5)"><text x="26" y="190" fill="#e6edf3" opacity="0"><tspan fill="#3fb950">$</tspan> buddy ls<set attributeName="opacity" to="1" begin="cycle.begin+6.20s" end="cycle.end"/></text></g>
<text x="26" y="208" fill="#c9d1d9" opacity="0">api                      lane-b                   open …<set attributeName="opacity" to="1" begin="cycle.begin+6.80s" end="cycle.end"/></text>
<text x="26" y="226" fill="#c9d1d9" opacity="0">store                    lane-a                   open …<set attributeName="opacity" to="1" begin="cycle.begin+6.80s" end="cycle.end"/></text>
